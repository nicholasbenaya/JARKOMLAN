# Eclipse Mosquitto Configuration
# Disesuaikan untuk Tugas JARKOMLAN (Mendukung koneksi cross-host / LAN)

# Port listener utama untuk protokol MQTT
listener 1883 0.0.0.0

# Izinkan koneksi tanpa autentikasi user/pass untuk kemudahan integrasi tugas lab
allow_anonymous true

# Konfigurasi persistensi antrean pesan
persistence true
persistence_location /mosquitto/data/

# Format logging ke stdout dan file
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
