events {
    worker_connections 1024;
}

http {
    # Logging format
    log_format loadbalancer '[$time_local] $remote_addr to: $upstream_addr '
                            'status: $status request: "$request" '
                            'rt: $request_time uct: "$upstream_connect_time"';

    access_log /var/log/nginx/access.log loadbalancer;
    error_log /var/log/nginx/error.log warn;

    # ==============================================================================
    # DEFINISI UPSTREAM CLUSTER BACKEND (HOST 1)
    # Catatan: Ganti 192.168.100.10 dengan Alamat IP Wi-Fi Host 1 Anda!
    # ==============================================================================
    upstream backend_nodes {
        # Algoritma Default: Round Robin (Beban dibagi merata 1:1:1:1)
        server 192.168.100.10:5001 max_fails=3 fail_timeout=10s; # Node 1: Windows Native
        server 192.168.100.10:5002 max_fails=3 fail_timeout=10s; # Node 2: Linux VM 1
        server 192.168.100.10:5003 max_fails=3 fail_timeout=10s; # Node 3: Linux VM 2
        server 192.168.100.10:5004 max_fails=3 fail_timeout=10s; # Node 4: Docker Container
    }

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://backend_nodes;

            # Header penting untuk mentransmisikan identitas klien asli
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeout setting
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
        }

        # Endpoint health-check Nginx itu sendiri
        location /nginx-health {
            return 200 "Nginx Reverse Proxy & Load Balancer is Healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
