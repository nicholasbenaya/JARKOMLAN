# ==============================================================================
# Konfigurasi Squid Proxy Server (Forward Caching Proxy)
# Praktikum Jaringan Komputer dan Komunikasi Data (JARKOMLAN) - Tugas 3
# ==============================================================================

# Port listening Squid
http_port 3128

# Definisi Access Control List (ACL)
# Mengizinkan koneksi dari jaringan lokal LAN / Wi-Fi dan localhost
acl localnet src 10.0.0.0/8      # RFC 1918 possible internal network
acl localnet src 172.16.0.0/12   # RFC 1918 possible internal network
acl localnet src 192.168.0.0/16  # RFC 1918 possible internal network (Wi-Fi LAN)
acl localnet src fc00::/7        # RFC 4193 local private network range
acl localnet src fe80::/10       # RFC 4291 link-local (directly plugged) machines

acl SSL_ports port 443
acl Safe_ports port 80          # http
acl Safe_ports port 8080        # http-alt
acl Safe_ports port 5001-5004   # cluster ports
acl Safe_ports port 443         # https
acl Safe_ports port 1025-65535  # unregistered ports

# Aturan Akses HTTP
http_access deny !Safe_ports
http_access allow localhost
http_access allow localnet
http_access deny all

# ==============================================================================
# KONFIGURASI CACHE STORAGE & POLICY
# ==============================================================================
# Alokasi RAM untuk cache objek panas (Memory Cache)
cache_mem 128 MB

# Ukuran maksimum objek yang boleh disimpan di cache
maximum_object_size 100 MB
maximum_object_size_in_memory 10 MB

# Lokasi penyimpanan cache di disk: format ufs, ukuran 1000MB (1GB), 16 dir tingkat 1, 256 dir tingkat 2
cache_dir ufs /var/spool/squid 1000 16 256

# Pengaturan umur cache (Refresh Pattern)
# Menahan file gambar, video, dan berkas statis di cache agar Cache HIT
refresh_pattern -i \.(gif|png|jpg|jpeg|ico|webp|svg)$ 1440 90% 10080
refresh_pattern -i \.(zip|tar|gz|rar|bin|iso|pdf)$     1440 90% 10080
refresh_pattern -i \.(html|htm|css|js)$                60   50% 1440
refresh_pattern .                                      0    20% 4320

# Format log akses agar mudah membaca status TCP_HIT vs TCP_MISS
logformat jarkom [%tl] %>a %Ss/%03>Hs %<st %rm %ru %[un %Sh/%<a %mt
access_log daemon:/var/log/squid/access.log jarkom

# Menutup informasi IP klien asli untuk keamanan (opsional)
forwarded_for on
via on
