events {
    worker_connections 1024;
}

http {
    log_format loadbalancer '[$time_local] $remote_addr to: $upstream_addr '
                            'status: $status request: "$request" '
                            'rt: $request_time uct: "$upstream_connect_time"';

    access_log /var/log/nginx/access.log loadbalancer;
    error_log /var/log/nginx/error.log warn;

    # ==============================================================================
    # DEFINISI UPSTREAM KLUSTER SERVER BACKEND (DI HOST 2)
    # Catatan: Nilai IP 192.168.100.20 otomatis diperbarui oleh start_reverse_proxy.bat
    # ==============================================================================
    upstream backend_cluster {
        # Algoritma Round Robin (1:1:1:1) menuju 4 Server di Host 2
        server 192.168.100.20:5001 max_fails=3 fail_timeout=10s; # Node 1: Windows Native
        server 192.168.100.20:5002 max_fails=3 fail_timeout=10s; # Node 2: Linux VM 1
        server 192.168.100.20:5003 max_fails=3 fail_timeout=10s; # Node 3: Linux VM 2
        server 192.168.100.20:5004 max_fails=3 fail_timeout=10s; # Node 4: Docker Container
    }

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://backend_cluster;

            # Forwarding headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
        }

        location /nginx-health {
            return 200 "Nginx Reverse Proxy & Load Balancer (Host 1) is Healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
